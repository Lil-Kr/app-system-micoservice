# 分片规则
rules:
  - !SHARDING
    tables:
      t_short_url_mapping:
        actualDataNodes: ds_$->{0..15}.t_short_url_mapping_$->{0..63}
        databaseStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: database-hash
        tableStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: table-hash
    shardingAlgorithms:
      database-hash:
        type: INLINE
        props:
          algorithm-expression: ds_${Math.abs(short_code.hashCode()) % 16}
      table-hash:
        type: INLINE
        props:
          algorithm-expression: t_short_url_mapping_${Math.abs(short_code.hashCode()) % 64}

props:
  sql-show: false
  # 是否在日志中打印简单风格的 SQL
  sql-simple: false
  # 每个查询最大连接数
  max-connections-size-per-query: 5
  # 检查表元数据是否开启
  check-table-metadata-enabled: false
  # 显示实际使用的SQL和日志
  sql-comment-parse-enabled: false
  # 禁用元数据刷新
  metadata-refresh-interval: -1
  # 启用路由信息打印
  show-sql-log: false