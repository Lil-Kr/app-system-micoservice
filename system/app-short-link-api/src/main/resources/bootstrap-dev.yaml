spring:
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 192.168.9.220:8848
        namespace: app-mico-service-dev
      config:
        import-check:
          enabled: false
        # 当前服务启动后去 nacos 中读取配置文件的后缀
        file-extension: yaml
        # 读取配置的 nacos 地址
        server-addr: 192.168.9.220:8848
        # 读取配置的 nacos 的名空间
        namespace: app-mico-service-dev
        refresh-enabled: true
    sentinel:
      transport:
        dashboard: localhost:9999
      eager: true
      enabled: true
      datasource:
        flow:
          nacos:
            server-addr: 192.168.9.220:8848
            # app-short-link-api-flow-rules
            dataId: ${spring.application.name}-flow-rules
            groupId: SENTINEL_GROUP
            dataType: json
            ruleType: flow
            namespace: app-mico-service-dev
            username: nacos
            password: nacos
        degrade:
          nacos:
            server-addr: 192.168.9.220:8848
            # app-short-link-api-degrade-rules
            dataId: ${spring.application.name}-degrade-rules
            groupId: SENTINEL_GROUP
            dataType: json
            ruleType: degrade
            namespace: app-mico-service-dev
            username: nacos
            password: nacos
  config:
    import:
      - optional:nacos:app-short-link-api.yaml

# 7901, 7911, 7921
server:
  port: 7901
  tomcat:
    uri-encoding: UTF-8
  servlet:
    context-path: /api