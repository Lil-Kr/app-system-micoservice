name: app-system

networks:
  app-network:
    external: true

services:
  # ================= API 层 =================

  # ================= Provider 层 =================
  app-picture-provider:
    build: ./provider
    image: app-picture-provider:v1.0.0
    ports:
      # 仅当跨主机需要
      - "5399:5399"
    environment:
      - TZ=Asia/Shanghai
      - DUBBO_PORT_TO_BIND=5399
      - DUBBO_PORT_TO_REGISTRY=5399
      - JAVA_OPTS=-XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=128m -Xms512m -Xmx512m -Xmn128m -Xss256k
    restart: always
    networks:
      - app-network